short_bio: >-
  <p>
    I am a Ph.D. candidate in Computer Science & Engineering at the
    <a href="https://cse.engin.umich.edu/" target="_blank">University of Michigan</a>,
    advised by <a href="https://valeria-bertacco.eecs.umich.edu/" target="_blank">Prof. Valeria Bertacco</a>.
    My research sits at the intersection of computer architecture, energy-efficient computing,
    and autonomous systems.
  </p>
  <p>
    I began my doctoral work on sustainable computing and energy-aware architectures.
    My current work focuses on hardware-software co-design for real-time point cloud based perception workloads,
    with a broader interest in how emerging computational demands shape architectural design.
    I earned my B.Sc. in Electrical and Computer Engineering from Addis Ababa University.
  </p>
  <p>Outside research, I enjoy reading, photography, and board games.</p>

